[project]
name = "equity-pilot"
version = "0.1.0"
description = "Autonomous multi-agent equity research and financial analysis engine"
readme = "README.md"
authors = [
    { name = "AnujKumar-1628", email = "anujmahlawat16@gmail.com" }
]
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.14,<5.0",
    "fastapi>=0.143.0,<1.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1,<4.0",
    "langchain>=1.4.5,<2.0",
    "langchain-community>=0.4.2,<1.0",
    "langchain-core>=1.6.10,<2.0",
    "langchain-openai>=1.7.1,<2.0",
    "langgraph>=1.2.15,<2.0",
    "langgraph-checkpoint-postgres>=3.1.3,<4.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0",
    "langsmith>=0.4.0,<1.0",
    "lxml>=6.0,<7.0",
    "mypy>=1.18,<2.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.3,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pymupdf>=1.26,<2.0",
    "pypdf>=6.0,<7.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "pytest-cov>=6.2,<8.0",
    "python-dotenv>=1.1,<2.0",
    "qdrant-client>=1.19.1,<2.0",
    "ruff>=0.14,<1.0",
    "tenacity>=9.0,<10.0",
    "typer>=0.16,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
equity-pilot = "equity_pilot.cli:main"
[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
